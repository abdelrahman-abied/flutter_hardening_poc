# Article 6, Gate 1 — auto-remediation. Dependabot supports the pub ecosystem
# and opens PRs to bump vulnerable/stale packages (GitHub Advisory Database).
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  # Native dependencies ride in too — scan Gradle as well.
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
